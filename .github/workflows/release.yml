name: Build and release Windows app

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

# Do not cancel an older commit's build when another commit is pushed.
concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install pnpm
        run: npm install --global pnpm@11.25.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check source and run tests
        run: |
          pnpm check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run Windows fixtures
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & ./tests/advanced-native-fixtures.ps1
          & ./tests/conversion-file-fixtures.ps1
          & ./tests/adk-command-fixtures.ps1
          & ./tests/virtualdisk-file-test.ps1
      - name: Build portable Windows executable
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm build --publish never
      - name: Prepare release files
        run: |
          New-Item -ItemType Directory -Path release-files | Out-Null
          Copy-Item -LiteralPath 'dist/Partly 20.exe' -Destination 'release-files/Partly-20-windows-x64.exe'
          $hash = (Get-FileHash -LiteralPath 'release-files/Partly-20-windows-x64.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Partly-20-windows-x64.exe" | Set-Content -LiteralPath 'release-files/SHA256SUMS.txt' -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release-files/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-files
      - name: Publish commit release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          tag="build-$COMMIT_SHA"
          printf 'Automated Windows x64 portable build.\n\nCommit: `%s`\nBranch: `%s`\n\nDownload `Partly-20-windows-x64.exe` and run it on Windows 10/11. Administrator access is required. This build is unsigned. `SHA256SUMS.txt` contains the package checksum.\n' "$COMMIT_SHA" "$BRANCH_NAME" > notes.md
          flags=(--prerelease --latest=false)
          if [ "$BRANCH_NAME" = "$DEFAULT_BRANCH" ]; then
            # Prevent a slower old build from replacing the newest download.
            head_sha=$(gh api "repos/$GH_REPO/commits" -f sha="$DEFAULT_BRANCH" -f per_page=1 --method GET --jq '.[0].sha')
            flags=(--latest=false)
            if [ "$COMMIT_SHA" = "$head_sha" ]; then flags=(--latest); fi
          fi
          # Reuse existing assets, including when a feature commit reaches
          # the default branch without changing its SHA (a fast-forward).
          if gh release view "$tag" >/dev/null 2>&1; then
            if [ "$BRANCH_NAME" = "$DEFAULT_BRANCH" ]; then
              gh release edit "$tag" --prerelease=false --notes-file notes.md "${flags[@]}"
            fi
            echo "Release $tag already exists; keeping its assets."
            exit 0
          fi
          gh release create "$tag" release-files/* \
            --target "$COMMIT_SHA" \
            --title "Partly 20 · ${COMMIT_SHA:0:7}" \
            --notes-file notes.md "${flags[@]}"
